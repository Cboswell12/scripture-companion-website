<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Email Confirmed — Scripture Companion</title>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/png" href="/favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root{--bg:#0e0b08;--gold:#b8966e;--parchment:#faf7f2;--muted:rgba(250,247,242,.68);
        --serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',-apple-system,sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--parchment);font-family:var(--sans);font-weight:300;line-height:1.7;
       -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;
       padding:24px;text-align:center}
  .card{max-width:440px}
  .spark{color:var(--gold);font-size:42px;line-height:1;margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,7vw,42px);line-height:1.15;margin-bottom:14px}
  p{font-size:16px;color:var(--muted)}
</style>
</head>
<body>
  <div class="card">
    <div class="spark">&#10022;</div>
    <h1>You&rsquo;re all set</h1>
    <p>Your email is confirmed. Head back to Scripture Companion and sign in with your email or Apple &mdash; same account, either way.</p>
  </div>
</body>
</html>
